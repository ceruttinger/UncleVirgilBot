project:
  type: website
  output-dir: docs
  resources:
    - data/public/**
    - data/processed/*.csv
    - data/processed/*.json
    - data/chapter_metadata.csv
    - assets/pdf/**
    - assets/js/**
    - assets/css/**

website:
  title: "Uncle Virgil Bot"
  site-url: "https://ceruttinger.github.io/UncleVirgilBot/"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: chapters.qmd
        text: Chapters
      - href: sentiment.qmd
        text: Sentiment
      - href: emotions.qmd
        text: Emotions
      - href: wordclouds.qmd
        text: Word Clouds
      - href: timeline.qmd
        text: Timeline
      - href: corpus_review.qmd
        text: Corpus QA
      - href: entities.qmd
        text: Entities
      - href: scans.qmd
        text: Scanned PDFs
      - href: search.qmd
        text: Search
      - href: chatbot.qmd
        text: Chatbot
      - href: next_steps.qmd
        text: Next Steps
      - href: aws_pipeline.qmd
        text: AWS Pipeline
      - href: about.qmd
        text: About
  page-footer:
    left: "Uncle Virgil memoir analysis project"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    toc: true
    css: assets/css/styles.css
    include-in-header: assets/html/noindex.html
    code-fold: true
    code-tools: true

execute:
  warning: false
  message: false
